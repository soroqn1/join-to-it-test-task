version: '3'

tasks:
  default:
    cmds:
      - task --list

  install:
    desc: Install dependencies via Poetry
    cmds:
      - poetry install

  dev:
    desc: Run Django development server
    cmds:
      - poetry run python manage.py runserver

  migrate:
    desc: Run database migrations
    cmds:
      - poetry run python manage.py migrate

  makemigrations:
    desc: Create new database migrations
    cmds:
      - poetry run python manage.py makemigrations

  ruff:
    desc: Check code formatting and linting with Ruff
    cmds:
      - poetry run ruff check .
      - poetry run ruff format --check .

  fix:
    desc: Automatically fix lints and format code
    cmds:
      - poetry run ruff check --fix .
      - poetry run ruff format .

  test:
    desc: Run pytest suite
    cmds:
      - poetry run pytest

  pre-commit:
    desc: Run pre-commit checks (ruff and test)
    deps: [ruff, test]

  docker-up:
    desc: Build and start Docker services
    cmds:
      - docker compose up --build

  docker-down:
    desc: Stop Docker services and clean volumes
    cmds:
      - docker compose down -v
